<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本株 上場来高値(ATH) 連続更新トラッカー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #12141d;
            color: #e1e3ea;
            margin: 0;
            padding: 15px;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .last-updated {
            font-size: 0.8rem;
            color: #8a8d9b;
            margin-bottom: 15px;
        }
        .table-container {
            overflow-x: auto;
            background: #1a1d29;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }
        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid #2a2e3d;
            white-space: nowrap;
        }
        th {
            background-color: #222634;
            color: #9da1b0;
            font-weight: 600;
        }
        tr:hover {
            background-color: #252a3a;
        }
        .badge {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .up { color: #22c55e; }
        .down { color: #ef4444; }
    </style>
</head>
<body>

    <h1>📈 日本株 上場来高値(ATH) 連続更新トラッカー</h1>
    <div class="last-updated" id="lastUpdated">最終更新日: 読み込み中...</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>コード</th>
                    <th>銘柄名</th>
                    <th>連続更新日数</th>
                    <th>株価</th>
                    <th>前日比</th>
                    <th>セクター</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <tr>
                    <td colspan="6" style="text-align:center;">データを読み込んでいます...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadATHData() {
            try {
                // キャッシュを回避するためにタイムスタンプを付与
                const response = await fetch('ath_data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error("データの取得に失敗しました");
                
                const data = await response.json();
                
                document.getElementById('lastUpdated').textContent = `最終更新日: ${data.last_updated}`;
                
                const tbody = document.getElementById('stockTableBody');
                tbody.innerHTML = '';
                
                const stocks = Object.entries(data.stocks).map(([code, info]) => ({
                    code,
                    ...info
                }));
                
                // 連続日数(降順) ➔ 前日比(降順) でソート
                stocks.sort((a, b) => b.consecutive_days - a.consecutive_days || b.change - a.change);

                if (stocks.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">本日のATH更新銘柄はありません</td></tr>';
                    return;
                }

                stocks.forEach(stock => {
                    const tr = document.createElement('tr');
                    
                    const changeClass = stock.change > 0 ? 'up' : (stock.change < 0 ? 'down' : '');
                    const changeSign = stock.change > 0 ? '+' : '';
                    
                    tr.innerHTML = `
                        <td><b>${stock.code}</b></td>
                        <td>${stock.name}</td>
                        <td><span class="badge">${stock.consecutive_days}日連続 🔥</span></td>
                        <td>¥${stock.price.toLocaleString()}</td>
                        <td class="${changeClass}">${changeSign}${stock.change}%</td>
                        <td>${stock.sector}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('stockTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ef4444;">データの読み込みエラーが発生しました</td></tr>';
            }
        }

        loadATHData();
    </script>
</body>
</html>
