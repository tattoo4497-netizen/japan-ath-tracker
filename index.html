<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日本株 上場来高値(ATH) 連続更新チェッカー</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; margin: 20px; }
        h1 { color: #f0b90b; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e222d; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #2a2e39; }
        th { background: #2a2e39; color: #787b86; }
        .badge { background: #2962ff; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .up { color: #089981; font-weight: bold; }
        .down { color: #f23645; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📈 日本株 上場来高値(ATH) 連続更新トラッカー</h1>
    <p id="updated"></p>

    <table>
        <thead>
            <tr>
                <th>コード</th>
                <th>銘柄名</th>
                <th>連続更新日数</th>
                <th>株価</th>
                <th>前日比</th>
                <th>セクター</th>
            </tr>
        </thead>
        <tbody id="stock-list"></tbody>
    </table>

    <script>
        async function loadData() {
            try {
                const res = await fetch('ath_data.json');
                const data = await res.json();
                document.getElementById('updated').innerText = `最終更新日: ${data.last_updated}`;
                
                const list = document.getElementById('stock-list');
                const sorted = Object.entries(data.stocks).sort((a, b) => b[1].consecutive_days - a[1].consecutive_days);
                
                list.innerHTML = sorted.map(([code, item]) => `
                    <tr>
                        <td><b>${code}</b></td>
                        <td>${item.name}</td>
                        <td><span class="badge">${item.consecutive_days}日連続 🔥</span></td>
                        <td>¥${item.price.toLocaleString()}</td>
                        <td class="${item.change >= 0 ? 'up' : 'down'}">${item.change > 0 ? '+' : ''}${item.change}%</td>
                        <td>${item.sector}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error("データ読み込みエラー:", e);
            }
        }
        loadData();
    </script>
</body>
</html>
