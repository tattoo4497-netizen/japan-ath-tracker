name: Hourly TradingView ATH Scan

on:
  schedule:
    # 日本時間 9:00〜16:00 の間、毎時0分（1時間ごと）に実行（月〜金）
    # UTC時間：0:00, 1:00, 2:00, 3:00, 4:00, 5:00, 6:00, 7:00 (月〜金)
    - cron: '0 0-7 * * 1-5'
  workflow_dispatch: # 手動実行用ボタンも残す

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ATH Tracker
        run: python tracker.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ath_data.json history/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update ATH data [skip ci]" && git push)
